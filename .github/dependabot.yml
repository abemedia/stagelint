version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 100

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
