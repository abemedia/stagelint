name: Publish

on:
  release:
    types: [published]

jobs:
  release:
    name: Build and publish binaries
    runs-on: macos-latest # zig can't link darwin without the macOS SDK
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            stagelint
            homebrew-tap
            scoop-bucket
            nur-packages

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ~> v2
          args: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            target/*/release/stagelint
            target/*/release/stagelint.exe
          if-no-files-found: error

  linux:
    name: Publish Linux packages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Kubri
        uses: kubri/kubri-action@v1
        with:
          version: ^0.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          KUBRI_PGP_KEY: ${{ secrets.KUBRI_PGP_KEY }}
          KUBRI_RSA_KEY: ${{ secrets.KUBRI_RSA_KEY }}

  npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: binaries
          path: target/

      - name: Install cargo-npm
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-npm

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: |
          cargo npm generate --infer-targets
          cargo npm publish -- --access public --provenance

  wheels:
    name: Build wheels
    runs-on: macos-latest # zig can't link darwin without the macOS SDK
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,x86_64-apple-darwin,aarch64-apple-darwin,x86_64-pc-windows-gnu,aarch64-pc-windows-gnullvm

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Install maturin
        run: pipx install 'maturin[zig]'

      - name: Build wheels
        run: |
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            maturin build --release --locked --zig --target "$target" --compatibility manylinux_2_17 musllinux_1_2 --out wheels
          done
          for target in x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-gnu aarch64-pc-windows-gnullvm; do
            maturin build --release --locked --zig --target "$target" --out wheels
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: wheels/*.whl
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: [release, wheels]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: wheels
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
