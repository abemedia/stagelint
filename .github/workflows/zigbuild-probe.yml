# Throwaway: checks whether every release target links from a Linux runner, so the publish
# workflow can drop macos-latest. Delete once the question is answered.
name: Zigbuild probe

on:
  workflow_dispatch:
  # workflow_dispatch only works once a workflow is on the default branch; this runs it from
  # the branch it is pushed on.
  push:
    paths: ['.github/workflows/zigbuild-probe.yml']

jobs:
  cargo:
    name: cargo-zigbuild ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-gnu
          - aarch64-pc-windows-gnullvm
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Inspect binary
        run: file target/${{ matrix.target }}/release/stagelint*

  maturin:
    name: maturin ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2

      - name: Install maturin
        run: pipx install 'maturin[zig]'

      - name: Build wheel
        run: maturin build --release --locked --zig --target ${{ matrix.target }} --out wheels

      - name: Inspect wheel
        run: ls -l wheels
