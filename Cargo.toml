[package]
name = "stagelint"
version = "0.1.5"
edition = "2024"
rust-version = "1.88"
description = "Run commands like linters and formatters on staged git files"
homepage = "https://stagelint.dev"
repository = "https://github.com/abemedia/stagelint"
license = "MIT"
exclude = [".github/", ".goreleaser.yml", "bench/", "pyproject.toml"]

[package.metadata.npm]
name = "@stagelint/stagelint"
prefix = "@stagelint/"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
command-group = { version = "5", features = ["with-tokio"] }
console = { version = "0.16", default-features = false, features = ["std"] }
ctrlc = { version = "3", features = ["termination"] }
gix = { version = "0.87", default-features = false, features = ["max-performance", "merge", "revision", "sha1", "sha256", "status", "worktree-mutation"] }
globset = "0.4"
indexmap = { version = "2", features = ["serde"] }
indicatif = { version = "0.18", default-features = false, features = ["unicode-width"] }
json5 = "1"
serde = { version = "1", features = ["derive"] }
serde_with = { version = "3", features = ["indexmap_2"] }
shell-words = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync"] }
tokio-util = "0.7"
which = "8"
yaml_serde = "0.10"

[dev-dependencies]
indicatif = { version = "0.18", default-features = false, features = ["in_memory"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "abort"  # Panics abort into the tested crash-recovery path (stash survives).
codegen-units = 1
