[package]
name = "stagelint"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Run commands like linters and formatters on staged git files"
repository = "https://github.com/abemedia/stagelint"
license = "MIT"
exclude = [".github/"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
command-group = { version = "5", features = ["with-tokio"] }
ctrlc = { version = "3", features = ["termination"] }
gix = {
  version = "0.86",
  default-features = false,
  features = [
    "max-performance",
    "merge",
    "sha1",
    "sha256",
    "status",
    "tree-editor",
    "worktree-mutation"
  ]
}
globset = "0.4"
indexmap = { version = "2", features = ["serde"] }
json5 = "1"
serde = { version = "1", features = ["derive"] }
serde_with = { version = "3", features = ["indexmap_2"] }
shell-words = "1"
thiserror = "2"
tokio = {
  version = "1",
  features = ["io-util", "macros", "process", "rt", "sync"]
}
tokio-util = "0.7"
yaml_serde = "0.10"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[target."cfg(windows)".dependencies]
which = "8"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "abort"  # Panics abort into the tested crash-recovery path (stash survives).
codegen-units = 1
